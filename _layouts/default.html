<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 120 }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">易伊 <span>Yi Yi</span></a>
    <nav>
      <a href="{{ '/' | relative_url }}">文章 Writings</a>
      <a href="{{ '/about/' | relative_url }}">关于 About</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    © {{ site.time | date: '%Y' }} 易伊 Yi Yi
  </footer>
</body>
</html>
